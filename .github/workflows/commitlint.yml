name: Lint Commit Messages

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Uses commitlint.config.mjs and @commitlint/config-conventional,
      # which the action bundles. See docs/COMMIT_MESSAGES.md.
      #
      # Dependabot's generated subject ("Bump <dep> from <old> to <new>") is
      # sentence-case, which config-conventional rejects. Skip the bot so its
      # otherwise-conventional updates are not blocked; the step is skipped (not
      # the job), so the required check still reports success.
      - name: Lint commit messages
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          helpURL: https://github.com/Emin-ACIKGOZ/scbake/blob/master/docs/COMMIT_MESSAGES.md
