name: Lint Commit Messages

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses commitlint.config.mjs and @commitlint/config-conventional,
      # which the action bundles. See docs/COMMIT_MESSAGES.md.
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          helpURL: https://github.com/Emin-ACIKGOZ/scbake/blob/master/docs/COMMIT_MESSAGES.md
