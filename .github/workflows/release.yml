#
# Automated release pipeline: compute the next version from Conventional
# Commits (svu), update CHANGELOG.md (git-cliff), tag, and publish (goreleaser).
#
# See .github/RELEASING.md and docs/COMMIT_MESSAGES.md.
name: Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release. Leave empty to auto-detect the next version."
        required: false
        default: ""

permissions:
  contents: write
  # Keyless Sigstore signing (cosign) and build-provenance attestations mint a
  # short-lived OIDC token and persist the resulting attestations. Neither
  # requires a stored secret: the identity is this workflow's OIDC subject.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Authenticate pushes as the release deploy key, which is registered as
          # a bypass actor on the "master protection" ruleset. GITHUB_TOKEN
          # cannot push to a protected branch.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        # Keyless (OIDC) signing and verification of SHA256SUMS. Also lets the
        # goreleaser-action verify the GoReleaser binary's own cosign signature.
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Install syft
        # GoReleaser's `sboms` pipe shells out to syft to build the SPDX SBOMs.
        uses: anchore/sbom-action/download-syft@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5

      - name: Install svu
        # actions/setup-go v6+ exports GOTOOLCHAIN=local, which prevents Go from
        # auto-downloading a newer toolchain than the one it installed. Keep
        # GOTOOLCHAIN=auto so `go install` can fetch the toolchain svu requires
        # (go >= 1.25.3) regardless of the Go version go.mod declares.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          # Manual re-release of an existing tag.
          if [ -n "$TAG" ]; then
            # Reject anything that is not a valid tag name. This also blocks
            # newline injection into $GITHUB_OUTPUT.
            if ! git check-ref-format "refs/tags/$TAG" >/dev/null 2>&1; then
              # Do not echo the raw value on stdout: it may contain newlines
              # that would be parsed as workflow commands.
              printf 'Invalid tag input: %s\n' "$TAG" >&2
              echo "::error::Invalid tag input; expected a valid git tag name"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "Manual release for tag $TAG"
            exit 0
          fi
          # `svu next` returns the current version when there is no bump, so
          # guard against re-releasing an existing tag.
          current="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next="$(svu next 2>/dev/null || true)"
          echo "current=${current} next=${next}"
          if [ -z "$next" ] || [ "$next" = "$current" ] || git rev-parse -q --verify "refs/tags/${next}" >/dev/null 2>&1; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Nothing to release."
          else
            echo "version=${next}" >> "$GITHUB_OUTPUT"
            echo "Next version: ${next}"
          fi

      - name: Generate CHANGELOG.md
        if: steps.version.outputs.version != '' && github.event.inputs.tag == ''
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog and tag
        if: steps.version.outputs.version != '' && github.event.inputs.tag == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -s -m "chore(release): ${{ steps.version.outputs.version }}" || echo "No changelog changes to commit"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin HEAD
          git push origin "${{ steps.version.outputs.version }}"

      - name: Prepare GoReleaser config
        if: steps.version.outputs.version != ''
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            # An older tag's tree may predate .goreleaser.yaml; use the current
            # config from the default branch. Write it outside the repo so the
            # git state stays clean (GoReleaser refuses to run when dirty).
            git show origin/master:.goreleaser.yaml > "$RUNNER_TEMP/goreleaser.yaml"
          else
            cp .goreleaser.yaml "$RUNNER_TEMP/goreleaser.yaml"
          fi

      - name: Run GoReleaser
        if: steps.version.outputs.version != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        # SLSA build provenance for the published artifacts, signed with the
        # same keyless identity. Verify with:
        #   gh attestation verify <file> --repo Emin-ACIKGOZ/scbake
        #
        # GoReleaser keeps the built binaries under dist/scbake_<os>_<arch>_<variant>/
        # (it renames them to scbake-<os>-<arch> only when uploading), so the
        # binary subject glob must match that build layout, not the asset name.
        if: steps.version.outputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/scbake_*/scbake*
            dist/*.sbom.json
            dist/SHA256SUMS
