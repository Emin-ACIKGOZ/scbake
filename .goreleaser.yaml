#
# GoReleaser configuration for scbake.
#
# Asset naming is deliberately kept compatible with install.sh, which downloads
#   <release>/scbake-<os>-<arch>[.exe]
# and a checksum file literally named SHA256SUMS. Do not "simplify" the archive
# naming or the checksum name without updating install.sh and the README.
version: 2

project_name: scbake

builds:
  - id: scbake
    main: ./main.go
    binary: scbake
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # Version comes solely from the git tag (single source of truth).
      - -s -w -X scbake/cmd.version={{ .Tag }}

# Emit bare, install.sh-compatible binaries instead of tar.gz/zip archives.
archives:
  - id: scbake
    formats: [binary]
    # GoReleaser appends ".exe" automatically for Windows in binary format.
    name_template: "scbake-{{ .Os }}-{{ .Arch }}"

checksum:
  # install.sh expects a file named exactly SHA256SUMS.
  name_template: SHA256SUMS
  algorithm: sha256
  # Also checksum the installer so users can verify a pinned download of it
  # against the same SHA256SUMS file. install.sh matches the binary by its
  # exact asset name, so the extra "install.sh" line does not affect it.
  extra_files:
    - glob: ./install.sh

# Generate an SPDX JSON SBOM for every binary with Syft and publish it as a
# release asset. syft must be on PATH (the release workflow installs it).
sboms:
  - id: scbake
    artifacts: binary

# Sign SHA256SUMS keylessly with cosign (Sigstore Fulcio/Rekor). Signing the
# checksum file transitively authenticates every binary it lists, so individual
# binaries do not each need a signature. cosign must be on PATH and the release
# workflow must grant `id-token: write`; the workflow also attests build
# provenance. Verification is documented in docs/INSTALLING.md.
signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^chore\(release\):'
      - '^test:'
      - '^ci:'

release:
  draft: false
  prerelease: auto
  make_latest: true
  name_template: "{{ .Tag }}"
  # Attach the installer to every release so a pinned, immutable URL exists:
  #   https://github.com/Emin-ACIKGOZ/scbake/releases/download/<tag>/install.sh
  extra_files:
    - glob: ./install.sh
  header: |
    scbake {{ .Tag }}

    Install or update with:

    ```sh
    curl -fsSL https://github.com/Emin-ACIKGOZ/scbake/releases/download/{{ .Tag }}/install.sh | bash
    ```
