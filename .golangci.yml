# .golangci.yml - Standardized Go Linter Configuration

version: "2"
run:
  # Default timeout for linter
  timeout: 5m
  # Include test files
  tests: true

linters:
  enable:
    # --- Core & Bugs ---
    - bodyclose
    - copyloopvar
    - errcheck
    - govet
    - nilerr
    - noctx
    - reassign
    - staticcheck
    - unused

    # --- Style, Performance & Idioms ---
    - goconst
    - ineffassign
    - misspell
    - mnd
    - perfsprint
    - predeclared
    - revive
    - whitespace

    # --- Complexity & Meta ---
    - cyclop
    - nolintlint

    # --- Security ---
    - gosec

  settings:
    misspell:
      locale: US
    goconst:
      # goconst's "extended detection" (>= 1.10.0) flags repeated literals in
      # test fixtures. Keep tests out of this check, matching goconst's own
      # default, so the linter upgrade does not force churn in test data.
      ignore-tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0